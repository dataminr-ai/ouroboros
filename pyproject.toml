[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.0.1"
dependencies = [
    "transformers",
    "accelerate",
    "datasets",
    "packaging"
]

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["src"]  # ["."] by default